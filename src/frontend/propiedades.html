<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propiedades disponibles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-secundaria">

  <header class="navbar navbar-light bg-light shadow-sm">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <img src="img/icon_cooperativa.png" width="40" height="40" alt="Logo"> Cooperativa
      </a>
      <a href="perfil.html" class="btn btn-outline-secondary btn-sm">Volver a mi perfil</a>
    </div>
  </header>

  <main class="container py-4">
    <!-- Filtros -->
    <div class="row g-2 mb-4">
      <div class="col-12 col-md-4">
        <input id="filtro-busqueda" class="form-control" type="search" placeholder="Buscar por título o descripción...">
      </div>
      <div class="col-6 col-md-4">
        <select id="filtro-dorm" class="form-select">
          <option value="">Dormitorios (todos)</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
        </select>
      </div>
      <div class="col-6 col-md-4">
        <select id="filtro-banos" class="form-select">
          <option value="">Baños (todos)</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
        </select>
      </div>
    </div>

    <!-- Estado / errores -->
    <div id="estado" class="mb-3 text-muted"></div>

    <!-- Grilla -->
    <div id="grid-propiedades" class="row g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // =========================
    // CONFIG
    // =========================
    const API_URL = "http://localhost:8000/casas.php"; // usa ?solo_activas=1
    const grid = document.getElementById("grid-propiedades");
    const estado = document.getElementById("estado");

    // Filtros
    const $busqueda = document.getElementById("filtro-busqueda");
    const $dorm = document.getElementById("filtro-dorm");
    const $banos = document.getElementById("filtro-banos");

    // Data en memoria
    let PROPIEDADES = [];

    // =========================
    // RENDER
    // =========================
    function crearTarjeta(prop) {
      const col = document.createElement("div");
      col.className = "col-12 col-md-6 col-lg-4";

      // Construimos array de imágenes válidas desde img1..img5
      const imagenes = [prop.img1, prop.img2, prop.img3, prop.img4, prop.img5].filter(Boolean);
      // Si no hay imágenes, ponemos un placeholder
      if (imagenes.length === 0) {
        imagenes.push("img/placeholder_casa.jpg"); // opcional: agregá este asset
      }

      const carouselId = "carousel-" + (prop.id ?? Math.random().toString(36).slice(2));

      const indicadores = imagenes.map((_, idx) => `
        <button type="button" data-bs-target="#${carouselId}" data-bs-slide-to="${idx}" ${idx===0 ? 'class="active" aria-current="true"' : ''} aria-label="Slide ${idx+1}"></button>
      `).join("");

      const slides = imagenes.map((src, idx) => `
        <div class="carousel-item ${idx===0 ? 'active' : ''}">
          <img src="${src}" class="d-block w-100 propiedad-img" alt="${(prop.titulo||'Casa')} - imagen ${idx+1}">
        </div>
      `).join("");

      col.innerHTML = `
        <div class="card h-100 shadow-sm propiedad-card">
          <div id="${carouselId}" class="carousel slide propiedad-carousel" data-bs-ride="carousel">
            <div class="carousel-indicators">
              ${indicadores}
            </div>
            <div class="carousel-inner">
              ${slides}
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#${carouselId}" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#${carouselId}" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Siguiente</span>
            </button>
          </div>

          <div class="card-body d-flex flex-column">
            <h5 class="card-title mb-2">${prop.titulo || "Casa"}</h5>
            <p class="card-text text-muted mb-3">${prop.descripcion || ""}</p>

            <div class="d-flex gap-2 mb-3 flex-wrap">
              <span class="chip-dato" title="Baños"><i class="bi bi-droplet-half me-1"></i>${Number(prop.banos||0)} baños</span>
              <span class="chip-dato" title="Dormitorios"><i class="bi bi-house-door me-1"></i>${Number(prop.dormitorios||0)} dorm</span>
              <span class="chip-dato" title="Metros cuadrados"><i class="bi bi-aspect-ratio me-1"></i>${Number(prop.metros||0)} m²</span>
            </div>

            <div class="mt-auto">
              <button class="btn btn-dark w-100 btn-solicitar" data-id="${prop.id ?? ''}">
                Solicitar
              </button>
            </div>
          </div>
        </div>
      `;
      return col;
    }

    function renderLista(propiedades) {
      grid.innerHTML = "";
      if (!propiedades || propiedades.length === 0) {
        grid.innerHTML = `<div class="col-12"><div class="alert alert-light border">No hay propiedades para mostrar.</div></div>`;
        return;
      }
      propiedades.forEach(p => grid.appendChild(crearTarjeta(p)));
      document.querySelectorAll(".btn-solicitar").forEach(btn => {
        btn.addEventListener("click", onSolicitar);
      });
    }

    // =========================
    // FILTROS
    // =========================
    function aplicarFiltros() {
      const term = ($busqueda.value || "").toLowerCase();
      const minDorm = parseInt($dorm.value || "0", 10);
      const minBanos = parseInt($banos.value || "0", 10);

      const filtradas = PROPIEDADES.filter(p => {
        const titulo = (p.titulo || "").toLowerCase();
        const desc = (p.descripcion || "").toLowerCase();
        const coincideTexto = titulo.includes(term) || desc.includes(term);
        const okDorm = minDorm ? Number(p.dormitorios||0) >= minDorm : true;
        const okBanos = minBanos ? Number(p.banos||0) >= minBanos : true;
        return coincideTexto && okDorm && okBanos;
      });

      renderLista(filtradas);
    }

    $busqueda.addEventListener("input", aplicarFiltros);
    $dorm.addEventListener("change", aplicarFiltros);
    $banos.addEventListener("change", aplicarFiltros);

    // =========================
    // DATA: FETCH
    // =========================
    async function cargarPropiedades() {
      try {
        estado.textContent = "Cargando propiedades...";
        const res = await fetch(`${API_URL}?solo_activas=1&ts=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Normalizamos a la estructura que usa el front
        PROPIEDADES = (data || []).map(c => ({
          id: c.id,
          titulo: c.titulo,
          descripcion: c.descripcion,
          banos: c.banos,
          dormitorios: c.dormitorios,
          metros: c.metros,
          img1: c.img1, img2: c.img2, img3: c.img3, img4: c.img4, img5: c.img5
        }));

        estado.textContent = "";
        aplicarFiltros(); // render con filtros actuales
      } catch (err) {
        console.error(err);
        estado.innerHTML = `<span class="text-danger">No se pudieron cargar las propiedades. Verificá el backend y la conexión.</span>`;
        grid.innerHTML = "";
      }
    }

    // =========================
    // ACCIÓN SOLICITAR (placeholder)
    // =========================
    function onSolicitar(e) {
      const id = e.currentTarget.getAttribute("data-id");
      alert("Solicitud enviada para la propiedad ID: " + id);
      // TODO: POST a tu endpoint de solicitudes si corresponde
    }

    // Init
    cargarPropiedades();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
